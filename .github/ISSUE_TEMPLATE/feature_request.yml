name: Feature request
description: Suggest an idea or an improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Home Media aims to stay simple and self-hosted, so please describe the problem you're trying to solve, not only the solution.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What are you trying to do, and what gets in the way today?
      placeholder: I keep track of ... and I can't ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
      description: How you imagine it working. Mockups or screenshots welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Workarounds you use now, or other ways this could work.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this hasn't been suggested yet.
          required: true
        - label: I'd be willing to help implement this.
